services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_SSL: ${DATABASE_SSL:-}
      DATABASE_SSL_REJECT_UNAUTH: ${DATABASE_SSL_REJECT_UNAUTH:-}
      DYNAMODB_PLANNER_LAYOUT_TABLE: ${DYNAMODB_PLANNER_LAYOUT_TABLE:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      PLANTNET_API_KEY: ${PLANTNET_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "${API_PORT:-3001}:3001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_API_BASE_URL: ${APP_API_BASE_URL:-}
      APP_PREDICT_API_URL: ${APP_PREDICT_API_URL:-}
      APP_GOOGLE_MAPS_API_KEY: ${APP_GOOGLE_MAPS_API_KEY:-}
      APP_FIREBASE_API_KEY: ${APP_FIREBASE_API_KEY:-}
      APP_FIREBASE_AUTH_DOMAIN: ${APP_FIREBASE_AUTH_DOMAIN:-}
      APP_FIREBASE_PROJECT_ID: ${APP_FIREBASE_PROJECT_ID:-}
      APP_FIREBASE_APP_ID: ${APP_FIREBASE_APP_ID:-}
      APP_FIREBASE_MESSAGING_SENDER_ID: ${APP_FIREBASE_MESSAGING_SENDER_ID:-}
      APP_FIREBASE_STORAGE_BUCKET: ${APP_FIREBASE_STORAGE_BUCKET:-}
      APP_FIREBASE_MEASUREMENT_ID: ${APP_FIREBASE_MEASUREMENT_ID:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
