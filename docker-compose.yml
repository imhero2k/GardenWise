# Local stack: frontend + API + DynamoDB Local
# Postgres/PostGIS: LocalStack RDS on host :4510 (or set DATABASE_URL)
#
#   docker compose up --build
#   open http://localhost:8080

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: gardenwise-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gardenwise-api
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://gardenwise:localpass@host.docker.internal:4510/gardenwise
      DATABASE_SSL: "0"
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_PLANNER_LAYOUT_TABLE: gardenwise-planner-layouts
      AWS_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - dynamodb
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /
    container_name: gardenwise-web
    ports:
      - "8080:80"
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
