apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: gardenwise
data:
  # LocalStack RDS on the Docker host (k3d → host.k3d.internal)
  DATABASE_URL: postgresql://gardenwise:localpass@host.k3d.internal:4510/gardenwise
  DATABASE_SSL: "0"
  DYNAMODB_ENDPOINT: http://dynamodb:8000
  DYNAMODB_PLANNER_LAYOUT_TABLE: gardenwise-planner-layouts
  AWS_REGION: ap-southeast-2
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  PORT: "3001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: gardenwise
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: gardenwise-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: api-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: gardenwise
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
