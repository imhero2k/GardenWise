apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb
  namespace: gardenwise
  labels:
    app: dynamodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamodb
  template:
    metadata:
      labels:
        app: dynamodb
    spec:
      containers:
        - name: dynamodb
          image: amazon/dynamodb-local:latest
          args: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb
  namespace: gardenwise
spec:
  selector:
    app: dynamodb
  ports:
    - port: 8000
      targetPort: 8000
---
# One-shot job: create planner layouts table
apiVersion: batch/v1
kind: Job
metadata:
  name: dynamodb-init
  namespace: gardenwise
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: amazon/aws-cli:2.15.0
          env:
            - name: AWS_ACCESS_KEY_ID
              value: local
            - name: AWS_SECRET_ACCESS_KEY
              value: local
            - name: AWS_DEFAULT_REGION
              value: ap-southeast-2
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for i in $(seq 1 30); do
                aws --endpoint-url=http://dynamodb:8000 dynamodb list-tables && break
                sleep 2
              done
              aws --endpoint-url=http://dynamodb:8000 dynamodb describe-table \
                --table-name gardenwise-planner-layouts >/dev/null 2>&1 && exit 0
              aws --endpoint-url=http://dynamodb:8000 dynamodb create-table \
                --table-name gardenwise-planner-layouts \
                --attribute-definitions \
                  AttributeName=userId,AttributeType=S \
                  AttributeName=layoutId,AttributeType=S \
                --key-schema \
                  AttributeName=userId,KeyType=HASH \
                  AttributeName=layoutId,KeyType=RANGE \
                --billing-mode PAY_PER_REQUEST
              echo "table ready"
